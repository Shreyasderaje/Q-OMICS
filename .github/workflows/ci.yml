name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Verify PennyLane backend against closed-form theory
        run: python scripts/test_quantum_layer.py

      - name: Run the test suite
        run: pytest -q

      - name: Lint
        run: ruff check qomics tests

  smoke:
    name: End-to-end smoke (baselines + quantum branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train a minimal model end to end
        run: |
          python -m qomics.cli train --repeats 1 --splits 5 --epochs 2 --skip-transformer

      - name: Confirm artefacts were produced
        run: |
          test -f artifacts/run.json
          test -f artifacts/biomarkers.csv
          python -c "import json;d=json.load(open('artifacts/run.json'));assert d['metrics']['models'];print('models:',len(d['metrics']['models']))"

      - name: Start the server and probe the API
        run: |
          python -m qomics.cli serve --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/overview  | head -c 200
          curl -sf http://127.0.0.1:8000/api/quantum    | head -c 200
          curl -sf http://127.0.0.1:8000/api/metrics    | head -c 200

  frontend:
    name: Frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check the frontend JavaScript
        run: |
          node --check qomics/web/assets/js/app.js
          node --check qomics/web/assets/js/charts.js

      - name: Assert the frontend makes no external network requests
        run: |
          if grep -RInE 'https?://(?!127\.0\.0\.1|localhost)' --include='*.js' --include='*.html' --include='*.css' -P qomics/web; then
            echo "external URL found in the frontend bundle"; exit 1
          fi
          echo "no external URLs in the frontend bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: qomics/web
